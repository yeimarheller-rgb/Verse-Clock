name: Atlas API audit (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate importer offline
        run: node --test tests/wiki-atlas.test.mjs
      - name: Sync from API (fails closed if API unavailable)
        run: node tools/sync-wiki-atlas.mjs atlas-audit
      - name: Validate export structure
        run: |
          node --input-type=module -e "import {readFileSync} from 'node:fs'; const d=JSON.parse(readFileSync('atlas-audit/wiki-atlas.json','utf8')); if(!d.version||!d.locations?.length||!d.counts?.Stanton||!d.counts?.Pyro||!d.counts?.Nyx) process.exit(1); console.log(JSON.stringify({version:d.version,counts:d.counts,total:d.locations.length}));"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: wiki-atlas-audit
          path: atlas-audit/wiki-atlas.json
          retention-days: 7
