name: Test
on:
  push:
    branches: [main, 'lab/**']
  pull_request:
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: dydrmr/VerseTime
          ref: 6092b98125d1db6077ba999c2d9bc5ccc3b2ff99
          path: _versetime
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/build-data.mjs _versetime/data
      - name: Auditar atlas y generar metadatos para las pruebas de navegador
        run: node tools/audit-atlas.mjs
      - run: sh tools/fetch-fonts.sh
      - run: pip install --quiet pillow && python3 tools/build-images.py
      - name: Validar sintaxis del importador Wiki (sin descargar datos)
        run: python3 -m py_compile lab-preview/tools/import_wiki_locations.py
      - name: Probar paginación y procedencia del importador Wiki sin red
        run: python3 -m unittest discover -s lab-preview/tools -p 'test_import_wiki_locations.py' -v
      - run: node --test tests/*.test.mjs
      - name: Comprobar integridad y brechas de cobertura del atlas LAB
        run: node --test lab-preview/tests/atlas-coverage-regression.test.mjs
      - name: Prueba real en navegador (bloquea el despliegue si la web no arranca)
        run: |
          pip install --quiet playwright==1.56.0
          python3 -m playwright install --with-deps chromium
          python3 -m http.server 8000 >/dev/null 2>&1 &
          sleep 1
          python3 tests/browser_smoke.py http://localhost:8000/
      - name: Publicar capturas de auditoría visual LAB
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lab-browser-screenshots
          path: /tmp/verse-lab-*.png
          if-no-files-found: ignore
