name: Atlas Source Probe
on:
  push:
    paths:
      - '.github/workflows/atlas-source-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect official API response shapes (no data mutation)
        run: |
          node --input-type=module <<'JS'
          const catalog=JSON.parse((await import('node:fs')).readFileSync('data/wiki-atlas.json','utf8'));
          const base='https://api.star-citizen.wiki';
          for(const url of [
            '/api/commodities?page%5Bsize%5D=2&version='+encodeURIComponent(catalog.version),
            '/api/missions?page%5Bsize%5D=2&version='+encodeURIComponent(catalog.version),
            '/api/locations/'+encodeURIComponent(catalog.locations.find(l=>l.id)?.id||'')+'/commodities?page%5Bsize%5D=2&version='+encodeURIComponent(catalog.version)
          ]){
            try{
              const c=new AbortController(),timer=setTimeout(()=>c.abort(),13000);
              let r;try{r=await fetch(base+url,{signal:c.signal,headers:{Accept:'application/json'}})}finally{clearTimeout(timer)}
              const result=await r.json();
              console.log('PROBE',url.split('?')[0],'status',r.status,'meta',JSON.stringify(result.meta||{}).slice(0,250));
              console.log('DATA',JSON.stringify((result.data||[]).slice?.(0,2)||result.data||{}).slice(0,4200));
            }catch(e){console.warn('PROBE ERROR',url.split('?')[0],String(e))}
          }
          JS